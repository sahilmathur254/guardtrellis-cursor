[project]
name = "guardtrellis-codex-adapter"
version = "0.1.0rc2"
description = "Shared local runtime for Codex and Claude UserPromptSubmit adapters"
requires-python = ">=3.11,<3.15"
dependencies = ["guardtrellis==0.1.9"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/.."
python_version = "3.11"
strict = true
